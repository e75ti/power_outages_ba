name: outage-scraper-stack

services:
  scraper-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: outage-scraper
    restart: unless-stopped
    environment:
      # Connects directly to the existing gras_postgres container
      - DATABASE_URI=postgresql://gras:password@gras_postgres:5432/outage_db
      - LOG_LEVEL=INFO
      - SCRAPE_INTERVAL_MINUTES=30
      - ENABLE_GEO_MATCHING=true
    networks:
      - shared_db_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_db_network:
    # This tells Docker this network already exists and is managed elsewhere
    name: gras_tracker_default
    external: true
