# compose.yaml
name: outage-scraper

services:
  scraper-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outage-scraper
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
        # Change this required to true if you are using the internal postgresql
        required: false
    environment:
      - DATABASE_URI=${DATABASE_URI:-postgresql+psycopg://outage_user:outage_secure_pass@postgres-db:5432/outage_db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-30}
      - ENABLE_GEO_MATCHING=${ENABLE_GEO_MATCHING:-true}
      - GEOLOCATOR_EMAIL=${GEOLOCATOR_EMAIL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outage-api
    restart: unless-stopped
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
        # Change this required to true if you are using the internal postgresql
        required: false
    environment:
      - DATABASE_URI=${DATABASE_URI:-postgresql+psycopg://outage_user:outage_secure_pass@postgres-db:5432/outage_db}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-db:
    image: postgres:18-alpine
    container_name: outage-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outage_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-outage_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - outage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outage_user} -d ${POSTGRES_DB:-outage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outage-telegram-bot
    restart: unless-stopped
    command: python -m src.bots.telegram_bot
    environment:
      - DATABASE_URI=${DATABASE_URI:-postgresql+psycopg://outage_user:outage_secure_pass@postgres-db:5432/outage_db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    depends_on:
      postgres-db:
        condition: service_healthy
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  nginx:
    image: nginx:alpine
    container_name: outage-nginx
    restart: unless-stopped
    ports:
      - "80:80"  # You can remove this line later once the tunnel is working!
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - api-server

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: outage-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

  # --- OPTIONAL OBSERVABILITY STACK ---
  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml -ingester.wal-disk-full-threshold=0
    container_name: loki
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    profiles:
      - observability
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles:
      - observability
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  outage_pgdata:
  loki_data:
  prom_data:
  grafana_data:
