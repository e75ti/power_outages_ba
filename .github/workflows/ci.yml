name: Build and Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code, Tests, and Container Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black isort flake8

    - name: Check Formatting (Black)
      run: black --check src/ tests/

    - name: Check Import Sorting (isort)
      run: isort --check-only src/ tests/

    - name: Lint Code (Flake8)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats formatting issues as warnings so it doesn't fail the build
        flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run SRE Address Matching Unit Tests
      run: |
        # PYTHONPATH=. ensures pytest can find the src/ module
        PYTHONPATH=. pytest tests/ -v

    - name: Verify Docker Image Build (Security & Syntax)
      run: |
        # Ensures the Dockerfile compiles with the non-root user and constraints
        docker build -t outage-scraper:test .
